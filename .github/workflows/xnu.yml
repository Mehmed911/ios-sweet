name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SWEET
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main, duchamp-bootstrap]
    paths:
      - "xnu/patches/**"
      - "tools/apply-duchamp-pid1-heartbeat-console.py"
      - "tools/stage-duchamp-qemu-ufs.py"
      - "tools/stage-duchamp-qemu-spi2.py"
      - "tools/stage-duchamp-qemu-backends.py"
      - "tools/stage-duchamp-gic-boot.py"
      - "tools/stage-duchamp-timer-boot.py"
      - "tools/stage-duchamp-counter-probe.py"
      - "tools/stage-duchamp-timer-probe.py"
      - "tools/stage-duchamp-psci-boot.py"
      - "duchamp/drivers/duchamp_gic_boot.h"
      - "duchamp/drivers/duchamp_timer_boot.h"
      - "duchamp/drivers/duchamp_counter_probe.h"
      - "duchamp/drivers/duchamp_timer_probe.h"
      - "duchamp/drivers/duchamp_psci_boot.h"
      - "duchamp/drivers/duchamp_ft3683g.c"
      - "duchamp/drivers/duchamp_ft3683g.h"
      - "tools/force-dxb-final-patch.py"
      - "duchamp/drivers/ufs_readonly.c"
      - "duchamp/drivers/ufs_readonly.h"
      - "duchamp/drivers/mt6897*.c"
      - "duchamp/drivers/mt6897*.h"
      - "duchamp/xnu/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}

jobs:
  build:
    # Preserve verified Xcode-15 generated IIG sources on the newer runner.
    # Intel runners have substantially more public capacity than macOS ARM.
    # Xcode cross-compiles the SWEET arm64 kernel, so the host ISA is irrelevant.
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          shasum -a 256 -c .github/xnu-inputs-491ff8b.sha256
          echo 'Baseline 491ff8b5695a44c0aa8caa1a55b4aa6b5408bf27 plus the bounded QEMU UFS probe (316 verified inputs)'
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # bsd_init.c is changed by dxb's alphabetic compatibility patches.
          # Apply the Duchamp pre-root checkpoint after those patches so its
          # context matches the exact source that will be compiled.
          mv dxb/patches/0208-duchamp-bsd-pre-root-stage.patch \
            dxb/patches/zzzz-duchamp-bsd-pre-root-stage.patch
          # Locale-dependent glob ordering can still visit zzzz before some
          # mixed-case upstream patches. Make it a mandatory post-pass.
          python3 tools/force-dxb-final-patch.py dxb/build.sh
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=/Applications/Xcode_16.4.app
          test -d "$XC"
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Install and verify the pinned 22G74 KDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=29866842eef039812888daea4176ce493be153b0d6d1b88f90753d69ea51b7d4
          dmg="$RUNNER_TEMP/KDK-22G74.dmg"
          valid() {
            [[ -f "$dmg" && "$(stat -f %z "$dmg")" = 658949979 ]] &&
              printf '%s  %s\n' "$sha" "$dmg" | shasum -a 256 -c -
          }
          if ! curl --fail --silent --show-error --location --retry 2 --retry-all-errors --connect-timeout 25 --max-time 140 \
            --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/octet-stream" \
            --output "$dmg" "https://api.github.com/repos/dortania/KdkSupportPkg/releases/assets/135995669?ci=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" || ! valid; then
            curl --fail --silent --show-error --location --retry 2 --retry-all-errors --connect-timeout 25 --max-time 140 \
              --output "$dmg" "https://github.com/dortania/KdkSupportPkg/releases/download/22G74/Kernel_Debug_Kit_13.5_build_22G74.dmg?ci=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            valid
          fi
          mount="$RUNNER_TEMP/kdk-22g74-mount"
          mkdir -p "$mount"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          sudo installer -pkg "$mount/KernelDebugKit.pkg" -target /
          hdiutil detach "$mount"
          test -d /Library/Developer/KDKs/KDK_13.5_22G74.kdk

      - name: Stage pinned IIG source outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Replacement retained archive verified byte-for-byte for the 39 IIG inputs and 34 generated files.
          curl --fail --location --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Mehmed911/ios-sweet/actions/artifacts/13714817484/zip \
            -o "$RUNNER_TEMP/iig-buildtree.zip"
          sed 's/1d9a9634d0abe7e3f0ddd43b1605bff77a5fb9b2abf734e762cdf96ed83fa7b7/d463795a854330f47d16f17c78285cbdec22fc54754419d9b8ad5bd12feeb965/' tools/duchamp-frozen-iig.py > "$RUNNER_TEMP/duchamp-frozen-iig.py"
          python3 "$RUNNER_TEMP/duchamp-frozen-iig.py" stage --archive "$RUNNER_TEMP/iig-buildtree.zip" --out "$RUNNER_TEMP/duchamp-iig-cache"
          chmod +x "$RUNNER_TEMP/duchamp-frozen-iig.py"
          echo "IIG=$RUNNER_TEMP/duchamp-frozen-iig.py" >> "$GITHUB_ENV"
          echo "DUCHAMP_IIG_CACHE=$RUNNER_TEMP/duchamp-iig-cache" >> "$GITHUB_ENV"

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          bash build.sh
          grep -Fq 'stage > 196' xnu/osfmk/arm64/sweet_early.c
          grep -Fq 'QEMU RAM BLOCK READY' xnu/iokit/bsddev/IOKitBSDInit.cpp
          grep -Fq 'MT6897 BACKEND STUB' xnu/iokit/bsddev/IOKitBSDInit.cpp
          grep -Fq 'DUCHAMP QUFS ROOT SELECTED' xnu/iokit/bsddev/IOKitBSDInit.cpp
          grep -Fq 'DUCHAMP QUFS READY' xnu/bsd/dev/duchamp_qemu_ufs.c
          grep -Fq 'DUCHAMP BOUNDED GICR BOOT V1' xnu/pexpert/arm/pe_fiq.c
          grep -Fq 'DUCHAMP CNTFRQ CONTRACT V1' xnu/osfmk/arm/arm_init.c
          grep -Fq 'DUCHAMP PRE-GIC COUNTER PROBE V1' xnu/osfmk/arm/arm_init.c
          grep -Fq 'DUCHAMP PRE-GIC TIMER EXPIRY PROBE V1' xnu/osfmk/arm/arm_init.c
          grep -Fq 'DUCHAMP PSCI CPU_ON AUTH GATE V1' xnu/iokit/Kernel/arm/SweetCPU.cpp
          grep -Fq 'DUCHAMP CPU BINDINGS V1' xnu/iokit/KernelConfigTables.cpp
          grep -Fq 'ARM64 bootstrap CPU' xnu/iokit/Kernel/arm/SweetCPU.cpp
          grep -Fq 'DUCHAMP UNKNOWN CLOCK RATIOS V1' xnu/pexpert/arm/pe_identify_machine.c
          grep -Fq 'XNULDRST' xnu/osfmk/arm64/start.s
          grep -Fq 'DUCHQEMU' xnu/osfmk/arm64/start.s
          grep -Fq 'sweet_early_timer_irq_witness' xnu/osfmk/arm64/sleh.c
          grep -Fq 'SWEET TIMER PPI%u IRQ CONFIRMED' xnu/osfmk/kern/startup.c
          grep -Fq 'SWEET PE TRACE 12: PE_INIT_IOKIT RETURNING' xnu/pexpert/arm/pe_init.c
          cmp ../duchamp/drivers/duchamp_gic_boot.h xnu/pexpert/arm/duchamp_gic_boot.h
          cmp ../duchamp/drivers/duchamp_timer_boot.h xnu/osfmk/arm/duchamp_timer_boot.h
          cmp ../duchamp/drivers/duchamp_counter_probe.h xnu/osfmk/arm/duchamp_counter_probe.h
          cmp ../duchamp/drivers/duchamp_timer_probe.h xnu/osfmk/arm/duchamp_timer_probe.h
          cmp ../duchamp/drivers/duchamp_psci_boot.h xnu/iokit/Kernel/arm/duchamp_psci_boot.h
          cmp ../duchamp/drivers/duchamp_ft3683g.c xnu/bsd/dev/duchamp_ft3683g.c
          cmp ../duchamp/drivers/duchamp_ft3683g.h xnu/bsd/dev/duchamp_ft3683g.h
          cmp ../duchamp/xnu/qemu_spi2_touch.c xnu/bsd/dev/qemu_spi2_touch.c
          cmp ../duchamp/xnu/qemu_spi2_dma_probe.c xnu/bsd/dev/qemu_spi2_dma_probe.c
          cmp ../duchamp/drivers/mt6897_spi2_probe.c xnu/bsd/dev/mt6897_spi2_probe.c
          grep -Fq 'duchamp_qemu_spi2_touch_step(self->fTestCount)' xnu/iokit/Kernel/arm/hid/SweetHID.cpp
          cmp ../duchamp/drivers/ufs_readonly.c xnu/bsd/dev/duchamp_ufs_core.c
          cmp ../duchamp/drivers/ufs_readonly.h xnu/bsd/dev/ufs_readonly.h
          cmp ../duchamp/drivers/ufs_gpt.c xnu/bsd/dev/duchamp_ufs_gpt.c
          cmp ../duchamp/drivers/ufs_gpt.h xnu/bsd/dev/ufs_gpt.h
          cmp ../duchamp/xnu/qemu_ufs.c xnu/bsd/dev/duchamp_qemu_ufs.c
          cmp ../duchamp/xnu/qemu_ufs_handoff.c xnu/bsd/dev/duchamp_qemu_ufs_handoff.c
          cmp ../duchamp/drivers/mt6897_ufs_probe.c xnu/bsd/dev/mt6897_ufs_probe.c
          grep -Fq 'mt6897_ufs_probe_read(&probe' xnu/bsd/dev/duchamp_qemu_ufs.c
          grep -Fq 'duchamp_qemu_ufs_handoff_enter();' xnu/osfmk/arm/arm_init.c
          grep -Fq 'duchamp_qemu_ufs_handoff_allows()' xnu/bsd/dev/duchamp_qemu_ufs.c
          grep -Fq 'DUCHAMP QEMU backend selftest failed' xnu/iokit/bsddev/IOKitBSDInit.cpp
          grep -Fq 'QEMU XNU BACKENDS SELFTEST PASS' xnu/bsd/dev/duchamp_qemu_backends.c
          grep -Fq 'QEMU XNU UFS LEASE PROVIDER DEFAULT CLOSED' xnu/bsd/dev/duchamp_qemu_backends.c
          grep -Fq 'QEMU XNU UFS CACHE CONTRACT DEFAULT CLOSED' xnu/bsd/dev/duchamp_qemu_backends.c
          grep -Fq 'QEMU XNU UFS CACHE PRIMITIVES PASS' xnu/bsd/dev/duchamp_qemu_backends.c
          grep -Fq 'QEMU XNU UFS DMA ROUTE DEFAULT CLOSED' xnu/bsd/dev/duchamp_qemu_backends.c
          for source in ../duchamp/drivers/mt6897*.c ../duchamp/drivers/mt6897*.h; do
            cmp "$source" "xnu/bsd/dev/$(basename "$source")"
          done
          cmp ../duchamp/xnu/mt6897_ufs_cache_backend.c xnu/bsd/dev/mt6897_ufs_cache_backend.c
          cmp ../duchamp/xnu/mt6897_ufs_cache_backend.h xnu/bsd/dev/mt6897_ufs_cache_backend.h
          grep -Fq 'QEMU RAM ROOT MOUNTED' xnu/bsd/kern/bsd_init.c
          grep -Fq 'QEMU RAM ROOT MOUNT FAILED' xnu/bsd/kern/bsd_init.c
          grep -Fq 'QEMU ROOTVNODE READY' xnu/bsd/kern/bsd_init.c
          grep -Fq 'PRE LOAD INIT PROGRAM' xnu/bsd/kern/bsd_init.c
          grep -Fq 'INIT EXEC ACCEPTED' xnu/bsd/kern/kern_exec.c
          grep -Fq 'INIT EXEC FAILED' xnu/bsd/kern/kern_exec.c
          grep -Fq 'PID1 FIRST SYSCALL' xnu/bsd/dev/arm/systemcalls.c
          grep -Fq 'PID1 OPEN CONSOLE' xnu/bsd/vfs/vfs_syscalls.c
          grep -Fq 'PID1 CONSOLE OPEN OK' xnu/bsd/vfs/vfs_syscalls.c
          grep -Fq 'PID1 CONSOLE OPEN FAILED' xnu/bsd/vfs/vfs_syscalls.c
          grep -Fq 'sweet_mkdir_kernel' xnu/bsd/vfs/vfs_syscalls.c
          grep -Fq 'DEV DIRECTORY READY' xnu/bsd/kern/bsd_init.c
          grep -Fq 'DEVFS CONSOLE READY' xnu/bsd/kern/bsd_init.c
          grep -Fq 'DEVFS MOUNT FAILED' xnu/bsd/kern/bsd_init.c
          grep -Fq 'PID1 STARTUP LINE COMPLETE' xnu/bsd/dev/arm/systemcalls.c
          grep -Fq 'PID1 FORK OK' xnu/bsd/dev/arm/systemcalls.c
          grep -Fq 'PID1 FIRST HEARTBEAT RETURNED' xnu/bsd/dev/arm/systemcalls.c
          grep -Fq 'sweet_console_fb' xnu/bsd/dev/arm/km.c

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          shopt -s nullglob
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          cp .github/xnu-inputs-491ff8b.sha256 out/SOURCE-INPUTS.txt
          printf '%s\n' "$GITHUB_SHA" > out/SOURCE-COMMIT.txt
          printf '%s\n' 'd463795a854330f47d16f17c78285cbdec22fc54754419d9b8ad5bd12feeb965' > out/IIG-ARCHIVE-SHA256.txt
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
